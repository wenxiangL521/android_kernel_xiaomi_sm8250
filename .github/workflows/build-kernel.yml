name: build-kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'LineageOS kernel branch'
        default: 'lineage-24.0'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/.ghcup /opt/az /usr/share/swift \
                      /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex \
            libssl-dev libelf-dev zip python3 cpio rsync libncurses-dev

      - name: Clone kernel
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.branch }}" \
            "https://github.com/${{ github.repository }}.git" kernel
          cd kernel
          echo "HEAD: $(git log --oneline -1)"
          echo "VERSION: $(make kernelversion 2>/dev/null)"
          du -sh .

      - name: Clone clang-r416183b
        run: |
          git clone --depth 1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b tc
          ./tc/bin/clang --version | head -2

      - name: Build (LTO kept)
        run: |
          cd kernel
          export PATH="$PWD/../tc/bin:$PATH"
          # CONFIG_CC_WERROR 是真实变量名（defconfig:728），不是 CONFIG_WERROR
          # Makefile:449-450 有两个硬编码 -Werror=xxx，需用 -Wno-error= 单独压
          WFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=return-type -Wno-unused-variable -Wno-unused-label"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CONFIG_CC_WERROR=n CONFIG_USB_GSPCA=y CONFIG_PS5169=y \
               vendor/kona-perf_defconfig
          # 关键：alioth.config 是 fragment，必须 merge 进 .config，
          # 否则 CONFIG_MACH_XIAOMI_ALIOTH 不开 -> MACH_XIAOMI 不开
          # -> dts Makefile 走 else 分支，只编 kona-* 参考板，
          # 且触摸/指纹/充电/马达/相机驱动全部缺失。
          echo "=== merge alioth.config fragment ==="
          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out \
               out/.config arch/arm64/configs/vendor/xiaomi/alioth.config
          # alioth 用 focaltech_spi(CONFIG_TOUCHSCREEN_FOCALTECH)，
          # kona-perf_defconfig 的旧 focaltech_touch(CONFIG_TOUCHSCREEN_FTS)
          # 会定义同名 fts_* 符号导致 ld duplicate symbol，必须关掉。
          scripts/config --file out/.config --disable TOUCHSCREEN_FTS
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          echo "=== 校验关键开关 ==="
          grep -E "MACH_XIAOMI|FOCALTECH|AW8697_HAPTIC|BQ2597X" out/.config || echo MISSING
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CONFIG_CC_WERROR=n CONFIG_USB_GSPCA=y CONFIG_PS5169=y \
               KCFLAGS="$WFLAGS" -j2
          # 默认目标不含小米的 overlay dtbo，需要显式编 dtbs
          echo "=== dtbs ==="
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CONFIG_CC_WERROR=n CONFIG_USB_GSPCA=y CONFIG_PS5169=y \
               KCFLAGS="$WFLAGS" dtbs -j2 2>&1 | tail -20
          ls -lh out/arch/arm64/boot/dts/vendor/qcom/*alioth* 2>/dev/null || echo "(no alioth dtbo)" 
          echo "=== artifacts ==="
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "(no Image)"
          ls -lh out/arch/arm64/boot/dts/vendor/qcom/*.dtb out/arch/arm64/boot/dts/vendor/qcom/*.dtbo 2>/dev/null | head -5
          cat out/include/config/kernel.release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alioth-kernel
          if-no-files-found: warn
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb
            kernel/out/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250-overlay.dtbo
            kernel/out/include/config/kernel.release
